# Example Slurm-web agent configuration for AWS Parallel Computing Service (PCS)
#
# This configuration demonstrates how to set up slurm-web agent to work with
# AWS PCS clusters using JWT authentication with AWS Secrets Manager.
#
# Prerequisites:
# 1. AWS PCS cluster with Slurm 25.05+ and REST API enabled
# 2. boto3 Python package installed: pip install boto3
# 3. AWS credentials configured (IAM role or AWS CLI credentials)
# 4. Permissions to read the JWT signing key from AWS Secrets Manager

[service]
# Name of your AWS PCS cluster
cluster = my-pcs-cluster

# Interface and port for the agent to listen on
interface = 0.0.0.0
port = 5012

# Enable CORS if needed for cross-origin requests
cors = true

[slurmrestd]
# URI to slurmrestd - typically running on the head node
# For AWS PCS, this is usually http://private-ip:6820
uri = http://10.0.1.100:6820

# Authentication method - must be jwt for PCS
auth = jwt

# JWT mode - set to 'pcs' for AWS PCS integration
jwt_mode = pcs

# Username for JWT authentication
# This is the username that will appear in the sun claim of the JWT
jwt_user = slurm-web

# Token lifespan in seconds (300 = 5 minutes is recommended for PCS)
# Short-lived tokens are more secure and PCS generates them on-demand
jwt_lifespan = 300

# ===== AWS PCS Specific Configuration =====

# AWS Secrets Manager secret ID or ARN for the JWT signing key
# Get this from your PCS cluster details in the AWS Console under
# "Scheduler Authentication" → "JSON Web Token (JWT) key ARN"
pcs_secret_id = arn:aws:secretsmanager:us-east-1:123456789012:secret:pcs-my-cluster-jwt-key-abc123

# AWS region where the secret is stored
pcs_region = us-east-1

# POSIX user ID to use in JWT tokens
# Default is 0 (root) which has full access to all Slurm operations
# You can use a different UID if you want to restrict permissions
pcs_uid = 0

# POSIX group ID to use in JWT tokens
# Default is 0 (root group)
pcs_gid = 0

# Additional POSIX group IDs (optional)
# If not specified, defaults to [pcs_gid]
#pcs_gids =
#  0
#  100

# GECOS field (user comment) for the JWT token
pcs_gecos = Slurm Web Agent

# Home directory for the JWT token user
pcs_home_dir = /

# Shell for the JWT token user
pcs_shell = /sbin/nologin

[jwt]
# Path to JWT key for slurm-web's internal authentication
# This is separate from the PCS JWT and is used for browser → gateway → agent auth
key = /var/lib/slurm-web/jwt.key
algorithm = HS256
audience = slurm-web

[policy]
# RBAC policy files
definition = /usr/share/slurm-web/conf/policy.yml
vendor_roles = /usr/share/slurm-web/conf/policy.ini
roles = /etc/slurm-web/policy.ini

[cache]
# Redis cache configuration (optional but recommended)
enabled = true
host = localhost
port = 6379
# password = your-redis-password

[racksdb]
# Disable RacksDB if not used in AWS PCS environment
enabled = false

[metrics]
# Prometheus metrics (optional)
enabled = false
